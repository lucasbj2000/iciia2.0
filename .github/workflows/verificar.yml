name: Verificar IMPAR CRM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis, imports y archivos sensibles
        run: node scripts/verificar.mjs
      - name: Pruebas de permisos y guia interactiva
        run: node scripts/test-ayudas.mjs
      - name: Pruebas de horarios y aviso de salida
        run: node scripts/test-horarios.mjs
      - name: Pruebas de login y recuperación de interfaz
        run: node scripts/test-login.mjs
      - name: Pruebas de canales y reconexión WhatsApp
        run: node scripts/test-canales-estables.mjs
      - name: IMPAR sin respuestas automáticas durante migración
        run: node scripts/test-pausa-bot.mjs
      - name: Importación Bitrix sin duplicados y sin actualización de clientes
        run: node scripts/test-importar-bitrix.mjs
      - name: Comprobar panel admin de accesos y exportación
        run: node scripts/test-accesos.mjs
      - name: Eliminación segura de usuarios con transferencia
        run: node scripts/test-eliminar-usuario.mjs
      - name: Historial continuo de clientes y reingresos
        run: node scripts/test-historial-chat.mjs
      - name: Verificar recuperación Signal de mensajes WhatsApp
        run: node scripts/test-wa-reintentos.mjs
      - name: Canal principal compartido y responsables de Contactos
        run: node scripts/test-principal-contactos.mjs
      - name: Layout de chat amplio y desplegables para agentes
        run: node scripts/test-chat-amplio.mjs
      - name: IMPAR Central única y clientes registrados de otras sucursales
        run: node scripts/test-central-unica-impar.mjs
      - name: Validar script de despliegue
        run: bash -n scripts/actualizar.sh

