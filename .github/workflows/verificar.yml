name: Verificar IMPAR CRM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis, imports y archivos sensibles
        run: node scripts/verificar.mjs
      - name: Pruebas de permisos y guia interactiva
        run: node scripts/test-ayudas.mjs
      - name: Pruebas de horarios y aviso de salida
        run: node scripts/test-horarios.mjs
