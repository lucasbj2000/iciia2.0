name: Verificar IMPAR CRM

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnosticar sintaxis exacta de interfaz Cloud API
        run: node --check public/js/admin.js
      - name: Verificar sintaxis, imports y archivos sensibles
        run: node scripts/verificar.mjs
      - name: Pruebas de permisos y guia interactiva
        run: node scripts/test-ayudas.mjs
      - name: Pruebas de horarios y aviso de salida
        run: node scripts/test-horarios.mjs
      - name: Pruebas de login y recuperación de interfaz
        run: node scripts/test-login.mjs
      - name: Rendimiento de acceso, cache y tablero progresivo sin perder permisos
        run: node scripts/test-rendimiento-impar.mjs
      - name: Pruebas de canales y reconexión WhatsApp
        run: node scripts/test-canales-estables.mjs
      - name: IMPAR sin respuestas automáticas durante migración
        run: node scripts/test-pausa-bot.mjs
      - name: Recepción de clientes nuevos por sucursal y derivación a Matriz en 2 horas
        run: node scripts/test-recepcion-sucursales.mjs
      - name: Catálogos empresariales con adjuntos PDF para agentes
        run: node scripts/test-catalogos-impar.mjs
      - name: ZIP cargado desde la web sin Hostinger y permisos de administrador
        run: node scripts/test-catalogos-zip-impar.mjs
      - name: Importación Bitrix sin duplicados y sin actualización de clientes
        run: node scripts/test-importar-bitrix.mjs
      - name: Comprobar panel admin de accesos y exportación
        run: node scripts/test-accesos.mjs
      - name: Eliminación segura de usuarios con transferencia
        run: node scripts/test-eliminar-usuario.mjs
      - name: Historial continuo de clientes y reingresos
        run: node scripts/test-historial-chat.mjs
      - name: Verificar recuperación Signal de mensajes WhatsApp
        run: node scripts/test-wa-reintentos.mjs
      - name: Comprobar ACK de entrega sin duplicar ni falsear enviados
        run: node scripts/test-wa-entregas-impar.mjs
      - name: Probar direccionamiento PN/LID por contacto sin reenvíos
        run: node scripts/test-wa-identidades-impar.mjs
      - name: Recepción Baileys y persistencia inmediata sin descargas bloqueantes
        run: node scripts/test-recepcion-baileys-buffer-impar.mjs
      - name: Reintentos escalonados de inbox antes de cuarentena
        run: node scripts/test-inbox-reintentos-impar.mjs
      - name: Mensajes WhatsApp no descifrables visibles y recuperables
        run: node scripts/test-wa-no-descifrados-impar.mjs
      - name: Respuestas citadas WhatsApp QR y Cloud API
        run: node scripts/test-citas-impar.mjs
      - name: Vigilancia de buffer prolongado de WhatsApp
        run: node scripts/test-wa-vigilancia-buffer.mjs
      - name: Recepción LID, append, medios e inserción de mensajes históricos
        run: node scripts/test-recepcion-lid-historicos-impar.mjs
      - name: WhatsApp Cloud API · webhook duradero, cifrado, HMAC y ACK
        run: node scripts/test-meta-cloud-impar.mjs
      - name: Canal principal compartido y responsables de Contactos
        run: node scripts/test-principal-contactos.mjs
      - name: Ficha 360, permisos y teléfonos múltiples
        run: node scripts/test-telefonos-impar.mjs
      - name: Búsqueda de clientes y edición del teléfono principal
        run: node scripts/test-busqueda-contactos.mjs
      - name: Ficha 360 abre y cierra durante carga y error
        run: node scripts/test-ficha360-cierre.mjs
      - name: Layout de chat amplio y desplegables para agentes
        run: node scripts/test-chat-amplio.mjs
      - name: Enlaces clicables y seguros en conversaciones e historial
        run: node scripts/test-enlaces-chat.mjs
      - name: IMPAR Central única y clientes registrados de otras sucursales
        run: node scripts/test-central-unica-impar.mjs
      - name: Verificar formulario único y chequeo público
        run: |
          node scripts/test-publicacion-central.mjs
          bash -n scripts/verificar-publicacion-central.sh
      - name: Validar script de despliegue y Protocolo 002
        run: |
          bash -n scripts/actualizar.sh
          bash -n scripts/backup.sh
          node scripts/test-respaldo-multimedia-viva.mjs
          bash -n scripts/verificar-publicacion.sh
          node scripts/test-protocolo-002.mjs

  migraciones_postgres:
    name: Migraciones de línea Central en PostgreSQL real
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: prueba_solo_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar cliente PostgreSQL
        run: npm ci --omit=dev
      - name: Verificar parche offline de Baileys 6.7.24 compilado
        run: |
          node scripts/patch-baileys-recepcion.mjs
          node scripts/patch-baileys-recepcion.mjs
          node scripts/patch-baileys-lid.mjs
      - name: Recuperación y cola de entrada con Baileys instalado
        run: node scripts/test-baileys-recepcion-instalado.mjs
      - name: Ejecutar migraciones 016 y 017 contra PostgreSQL real
        env:
          TEST_DATABASE_URL: postgresql://postgres:prueba_solo_ci@127.0.0.1:5432/postgres
        run: node scripts/test-migraciones-central-pg.mjs
      - name: Migración de mensajes históricos y precisión cronológica en PostgreSQL real
        env:
          TEST_DATABASE_URL: postgresql://postgres:prueba_solo_ci@127.0.0.1:5432/postgres
        run: node scripts/test-historicos-pg.mjs
      - name: Índices y consultas rápidas de login y tablero PostgreSQL real
        env:
          TEST_DATABASE_URL: postgresql://postgres:prueba_solo_ci@127.0.0.1:5432/postgres
        run: node scripts/test-rendimiento-pg.mjs
      - name: Teléfonos secundarios y colisiones en PostgreSQL real
        env:
          TEST_DATABASE_URL: postgresql://postgres:prueba_solo_ci@127.0.0.1:5432/postgres
        run: node scripts/test-telefonos-pg.mjs
      - name: Recepción por sucursal, reparto concurrente y Matriz en PostgreSQL real
        env:
          TEST_DATABASE_URL: postgresql://postgres:prueba_solo_ci@127.0.0.1:5432/postgres
        run: node scripts/test-recepcion-sucursales-pg.mjs
